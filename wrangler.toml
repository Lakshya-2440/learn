name = "learn"
main = "src/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"


# Run `wrangler d1 create education_db` and paste the returned UUID below.
[[d1_databases]]
binding = "DB"
database_name = "education_db"
database_id = "07742e11-50c4-410f-a411-f635b288ff0b"


[durable_objects]
bindings = [
	{ name = "WAITINGROOM_DO", class_name = "WaitingRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WaitingRoomDO"]
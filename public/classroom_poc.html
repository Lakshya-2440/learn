<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time virtual classroom POC — ClassroomDO WebSocket MVP" />
    <title>Virtual Classroom</title>
    <script>
        if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        teal: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0D9488', 700: '#0f766e',
                            800: '#115e59', 900: '#134e4a',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            color-scheme: light;
            --vc-page: #f8fafc;
            --vc-panel: rgba(255, 255, 255, .94);
            --vc-muted-panel: #f1f5f9;
            --vc-border: #dbe3ea;
            --vc-text: #0f172a;
            --vc-muted: #475569;
            --vc-soft: #64748b;
            --vc-accent: #0f766e;
        }
        .dark {
            color-scheme: dark;
            --vc-page: #020617;
            --vc-panel: rgba(15, 23, 42, .88);
            --vc-muted-panel: #111827;
            --vc-border: #1f2937;
            --vc-text: #f8fafc;
            --vc-muted: #cbd5e1;
            --vc-soft: #94a3b8;
            --vc-accent: #2dd4bf;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(20, 184, 166, .16), transparent 32rem),
                radial-gradient(circle at top right, rgba(249, 115, 22, .12), transparent 30rem),
                var(--vc-page);
            color: var(--vc-text);
        }
        html:not(.dark) .vc-theme .bg-gray-950 { background-color: transparent !important; }
        html:not(.dark) .vc-theme .bg-gray-900,
        html:not(.dark) .vc-theme .bg-gray-900\/90,
        html:not(.dark) .vc-theme .bg-gray-900\/80,
        html:not(.dark) .vc-theme .bg-gray-900\/70,
        html:not(.dark) .vc-theme .bg-gray-900\/60 {
            background-color: var(--vc-panel) !important;
        }
        html:not(.dark) .vc-theme .bg-gray-800,
        html:not(.dark) .vc-theme .bg-gray-800\/80,
        html:not(.dark) .vc-theme .bg-gray-800\/70 {
            background-color: var(--vc-muted-panel) !important;
        }
        html:not(.dark) .vc-theme .border-gray-800,
        html:not(.dark) .vc-theme .border-gray-700 {
            border-color: var(--vc-border) !important;
        }
        html:not(.dark) .vc-theme .text-gray-100,
        html:not(.dark) .vc-theme .text-gray-200,
        html:not(.dark) .vc-theme .text-gray-300 {
            color: var(--vc-text) !important;
        }
        html:not(.dark) .vc-theme .text-gray-400,
        html:not(.dark) .vc-theme .text-gray-500 {
            color: var(--vc-muted) !important;
        }
        html:not(.dark) .vc-theme input,
        html:not(.dark) .vc-theme textarea {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: var(--vc-border) !important;
        }
        html:not(.dark) .vc-theme input::placeholder,
        html:not(.dark) .vc-theme textarea::placeholder { color: #94a3b8 !important; }
        html:not(.dark) .vc-theme kbd {
            background: #ffffff !important;
            border-color: var(--vc-border) !important;
            color: #334155 !important;
        }
        html:not(.dark) .vc-theme #myNameLabel,
        html:not(.dark) .vc-theme #myCharacter .bg-gray-900\/90,
        html:not(.dark) .vc-theme #avatarLayer .bg-gray-900\/90 {
            color: #0f172a !important;
        }
        html:not(.dark) .vc-theme #myCharacter .bg-gray-900\/90,
        html:not(.dark) .vc-theme #avatarLayer .bg-gray-900\/90 {
            border: 1px solid var(--vc-border);
        }
        html:not(.dark) .vc-theme #viewerBanner {
            background: #fff7ed !important;
            border-color: #fed7aa !important;
            color: #9a3412 !important;
        }
        html:not(.dark) .vc-theme #viewerBanner a { color: #0f766e !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #14b8a6; border-radius: 999px; }
        @keyframes dotPulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
        .dot-pulse { animation: dotPulse 1.5s ease-in-out infinite; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .fade-in-up { animation: fadeInUp .3s ease-out; }
        @keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
        .slide-in { animation: slideIn .3s ease-out; }
    </style>
</head>

<body class="vc-theme min-h-screen bg-slate-50 dark:bg-gray-950 font-sans text-gray-900 dark:text-gray-100 flex flex-col transition-colors duration-300">

<!-- LOBBY SCREEN-->
<div id="lobby" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-teal-400 to-emerald-300 bg-clip-text text-transparent">
                Virtual Classroom
            </h1>
            <p class="text-gray-400 mt-2 text-sm">Real Time Classroom Experience</p>
        </div>

        <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-2xl p-6 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label for="lobbyRoomId" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Room ID</label>
                    <div class="relative">

                        <input id="lobbyRoomId" type="text" value="demo-room" placeholder="e.g. demo-room"

                    </div>
                </div>
                <div>
                    <label for="lobbyDisplayName" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Display Name</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input id="lobbyDisplayName" type="text" placeholder="Your name"
                               class="w-full pl-10 pr-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500 transition" />
                    </div>
                </div>
                <button id="btnJoin" type="button"
                        class="w-full py-3 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-500 hover:to-teal-400 text-white font-semibold rounded-lg shadow-lg shadow-teal-600/20 transition-all duration-200 flex items-center justify-center gap-2 active:scale-[.98]">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span id="btnJoinLabel">Join Classroom</span>

            </div>

</div>

<!--CLASSROOM SCREEN-->
<div id="classroomScreen" class="flex-1 flex-col hidden">

    <!-- Top Bar -->
    <header class="bg-gray-900/90 backdrop-blur-xl border-b border-gray-800 px-4 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-800 rounded-full text-xs font-medium">
                <span id="connDot" class="w-2 h-2 rounded-full bg-red-500 dot-pulse"></span>
                <span id="connText" class="text-gray-400">Connecting…</span>
            </div>
            <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-gray-800 rounded-full text-xs font-medium text-gray-300">
                <i data-lucide="hash" class="w-3 h-3 text-teal-400"></i>
                <span id="topRoomId">—</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnParticipants"
                    type="button"
                    aria-label="Show active participants"
                    aria-controls="participantsSidebar"
                    aria-expanded="false"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-medium text-gray-300 transition">
                <i data-lucide="users" class="w-3.5 h-3.5 text-teal-400"></i>
                <span id="participantCount">0</span>
            </button>
            <button id="btnLeave" type="button"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-xs font-medium transition">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                Leave
            </button>
        </div>
    </header>

    <div id="viewerBanner" class="hidden bg-amber-500/10 border-b border-amber-500/30 px-4 py-2 text-xs sm:text-sm text-amber-100">
        You are viewing this classroom. <a id="viewerLoginLink" href="/login" class="font-semibold text-white underline underline-offset-2">Sign in to chat, move, sit, react, or use the whiteboard.</a>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">

        <!-- Classroom Canvas -->
        <div class="flex-1 flex flex-col p-3 gap-3 min-w-0 min-h-0">
            <div id="classroomCanvas" class="flex-1 min-h-[280px] lg:min-h-[400px] relative rounded-xl overflow-hidden border border-gray-800 shadow-2xl">
                <!-- Walls -->
                <div class="absolute inset-0" style="background: linear-gradient(180deg, #E6E2D7 0%, #E6E2D7 38%, #C7B299 38%, #C7B299 100%);"></div>
                <!-- Wainscoting line -->
                <div class="absolute left-0 right-0" style="top:38%; height:4px; background:#a0a0a0;"></div>
                <!-- Blackboard -->
                <div class="absolute left-1/2 -translate-x-1/2 rounded-lg shadow-lg flex items-center justify-center"
                     style="top:3%; width:40%; height:14%; background:#005C53; border:4px solid #3a3a3a;">
                    <span class="text-white/60 text-xs font-medium tracking-wider uppercase select-none">Blackboard</span>
                </div>
                <!-- Teacher desk -->
                <div class="absolute left-1/2 -translate-x-1/2 rounded shadow-md flex items-center justify-center"
                     style="top:20%; width:18%; height:7%; background:#8B4513; border:2px solid #6B3410;">
                    <span class="text-white/50 text-[10px] font-medium select-none">Teacher's Desk</span>
                </div>
                <!-- Student desks (3 rows x 5 cols) -->
                <div id="desksContainer" class="absolute left-[3%] right-[3%]" style="top:39%; bottom:3%;"></div>
                <!-- Other participant avatars -->
                <div id="avatarLayer" class="absolute inset-0 pointer-events-none" style="z-index:40;"></div>
                <!-- Current user character -->
                <div id="myCharacter" class="absolute transition-all duration-75 ease-linear" style="z-index:50; display:none;">
                    <div class="flex flex-col items-center">
                        <div class="relative w-9 h-9 rounded-full bg-gradient-to-br from-teal-400 to-teal-600 flex items-center justify-center text-white text-xs font-bold shadow-lg shadow-teal-500/30 border-2 border-white/30">
                            <span id="myInitial">?</span>
                            <span id="myPresenceBadge" class="absolute -top-1 -right-1 text-[12px] leading-none"></span>
                        </div>
                        <div class="mt-0.5 px-2 py-0.5 bg-gray-900/90 rounded text-[10px] text-white font-medium whitespace-nowrap shadow">
                            <span id="myNameLabel">You</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Controls bar -->
            <div class="flex flex-wrap items-center gap-3 px-3 py-2 bg-gray-900/60 rounded-lg border border-gray-800 text-xs text-gray-400 shrink-0">
                <div class="flex items-center gap-1.5">
                    <kbd class="px-1.5 py-0.5 bg-gray-800 rounded text-[10px] font-mono border border-gray-700">↑</kbd>
                    <kbd class="px-1.5 py-0.5 bg-gray-800 rounded text-[10px] font-mono border border-gray-700">↓</kbd>
                    <kbd class="px-1.5 py-0.5 bg-gray-800 rounded text-[10px] font-mono border border-gray-700">←</kbd>
                    <kbd class="px-1.5 py-0.5 bg-gray-800 rounded text-[10px] font-mono border border-gray-700">→</kbd>
                    <span class="ml-1">Move</span>
                </div>
                <div class="hidden sm:flex items-center gap-1.5">
                    <kbd class="px-1.5 py-0.5 bg-gray-800 rounded text-[10px] font-mono border border-gray-700">E</kbd>
                    <span>Sit/Stand</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btnThumbsUp" type="button" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-gray-200 transition" title="Send thumbs-up reaction">
                        👍
                    </button>
                    <button id="btnRaiseHand" type="button" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-gray-200 transition" title="Toggle raised hand">
                        ✋
                    </button>
                </div>
                <div class="flex items-center gap-1.5 border-l border-gray-700/60 pl-2">
                    <button id="btnToggleMic" type="button" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-gray-200 transition flex items-center gap-1.5" title="Toggle microphone">
                        <span id="micIcon">🎙️</span>
                        <span id="micText" class="hidden md:inline">Mute</span>
                    </button>
                    <button id="btnToggleCam" type="button" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-gray-200 transition flex items-center gap-1.5" title="Toggle camera">
                        <span id="camIcon">📷</span>
                        <span id="camText" class="hidden md:inline">Stop Video</span>
                    </button>
                </div>
                <div class="w-full sm:w-auto sm:ml-auto text-gray-500">Virtual Classroom</div>
            </div>
        </div>

        <!-- Chat Sidebar -->
        <div id="chatPanel" class="w-full lg:w-80 h-64 lg:h-auto shrink-0 bg-gray-900/70 border-t lg:border-t-0 lg:border-l border-gray-800 flex flex-col">
            <div class="px-4 py-3 border-b border-gray-800 flex items-center gap-2">
                <i data-lucide="message-circle" class="w-4 h-4 text-teal-400"></i>
                <h2 class="text-sm font-semibold text-gray-200">Room Chat</h2>
            </div>
            <div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-2">
                <div class="text-center text-xs text-gray-600 py-6">No messages yet!</div>
            </div>
            <form id="chatForm" class="p-3 border-t border-gray-800 flex gap-2">
                <label for="chatInput" class="sr-only">Chat message</label>
                <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off"
                       class="flex-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500 transition" />
                <button type="submit"
                        aria-label="Send chat message"
                        class="px-3 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg transition flex items-center">

        </div>
    </div>
</div>

<!-- PARTICIPANT SIDEBAR -->
<div id="participantsSidebar" aria-label="Active participants" class="fixed inset-y-0 right-0 w-80 bg-gray-900 border-l border-gray-800 shadow-2xl z-[60] transform translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <h2 class="text-sm font-semibold flex items-center gap-2">
            <i data-lucide="users" class="w-4 h-4 text-teal-400"></i>
            Active Participants
        </h2>
        <button id="btnCloseParticipants" type="button" aria-label="Close active participants panel" class="p-1 hover:bg-gray-800 rounded-lg transition">
            <i data-lucide="x" class="w-4 h-4 text-gray-400"></i>
        </button>
    </div>
    <div id="participantsList" class="p-3 space-y-2 overflow-y-auto" style="max-height:calc(100vh - 56px);">
    </div>
</div>

<!-- NOTIFICATION TOAST -->
<div id="toastContainer" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 items-end pointer-events-none"></div>

<script>
(function() {
    'use strict';

    const lobby               = document.getElementById('lobby');
    const classroomScreen     = document.getElementById('classroomScreen');
    const lobbyRoomId         = document.getElementById('lobbyRoomId');
    const lobbyDisplayName    = document.getElementById('lobbyDisplayName');
    const btnJoin             = document.getElementById('btnJoin');
    const btnJoinLabel        = document.getElementById('btnJoinLabel');
    const btnLeave            = document.getElementById('btnLeave');
    const connDot             = document.getElementById('connDot');
    const connText            = document.getElementById('connText');
    const topRoomId           = document.getElementById('topRoomId');
    const participantCount    = document.getElementById('participantCount');
    const classroomCanvas     = document.getElementById('classroomCanvas');
    const avatarLayer         = document.getElementById('avatarLayer');
    const myCharacter         = document.getElementById('myCharacter');
    const myInitial           = document.getElementById('myInitial');
    const myNameLabel         = document.getElementById('myNameLabel');
    const myPresenceBadge     = document.getElementById('myPresenceBadge');
    const chatMessages        = document.getElementById('chatMessages');
    const chatForm            = document.getElementById('chatForm');
    const chatInput           = document.getElementById('chatInput');
    const chatSubmit          = chatForm.querySelector('button[type="submit"]');
    const btnParticipants     = document.getElementById('btnParticipants');
    const participantsSidebar = document.getElementById('participantsSidebar');
    const btnCloseParticipants= document.getElementById('btnCloseParticipants');
    const participantsList    = document.getElementById('participantsList');
    const desksContainer      = document.getElementById('desksContainer');
    const toastContainer      = document.getElementById('toastContainer');
    const btnThumbsUp         = document.getElementById('btnThumbsUp');
    const btnRaiseHand        = document.getElementById('btnRaiseHand');
    const btnToggleMic        = document.getElementById('btnToggleMic');
    const btnToggleCam        = document.getElementById('btnToggleCam');
    const micIcon             = document.getElementById('micIcon');
    const micText             = document.getElementById('micText');
    const camIcon             = document.getElementById('camIcon');
    const camText             = document.getElementById('camText');
    const viewerBanner        = document.getElementById('viewerBanner');
    const viewerLoginLink     = document.getElementById('viewerLoginLink');

    // Authentication utils
    function getAuth() {
        return {
            token: localStorage.getItem('edu_token'),
            user: JSON.parse(localStorage.getItem('edu_user') || 'null')
        };
    }

    function isAuthenticated() {
        const { token, user } = getAuth();
        return token && user;
    }

    // COORDINATE HELPERS
    // Positions are stored and transmitted as NORMALIZED values (0.0 – 1.0)
    // representing a fraction of the canvas width/height.
    // This means User A's position looks identical on User B's screen regardless
    // of their different window/canvas pixel sizes.

    // Convert local pixel coords → normalized (0–1) for sending over the wire.
    function toNorm(px, py) {
        const r = classroomCanvas.getBoundingClientRect();
        return {
            x: r.width  > 0 ? px / r.width  : 0.5,
            y: r.height > 0 ? py / r.height : 0.5,
        };
    }

    // Convert normalized (0–1) coords → local pixel coords for rendering.
    function toPx(nx, ny) {
        const r = classroomCanvas.getBoundingClientRect();
        return { x: nx * r.width, y: ny * r.height };
    }

    // State
    let ws = null;
    let presenceWs = null;
    let roomId = '';
    let myParticipantId = '';
    let myDisplayName = '';
    let mySessionId = '';
    let reconnectAttempts = 0;
    let presenceReconnectAttempts = 0;
    let intentionalDisconnect = false;
    let canInteract = false;
    const MAX_RECONNECT = 10;
    const BASE_DELAY = 1000;
    let reconnectTimer = null;
    let presenceReconnectTimer = null;

    // participants: participant_id → { display_name, normPos:{x,y}, direction, is_moving, seat_id }
    // normPos is always in normalized (0–1) space.
    const participants = {};
    // user_id -> { x, y, emoji, hand_raised, display_name }
    const presenceByUser = {};
    let pendingSelfPresenceReplay = false;
    // seat_id -> { name, pid }
    const seatOccupants = {};

    const THROTTLE_MS = 100;
    let lastPositionSend = 0;
    let keysPressed = {};
    let isSeated = false;
    let currentSeat = null;
    let animFrameId = null;
    let chatFirstMessage = true;

    const AVATAR_COLORS = [
        ['#8B5CF6','#7C3AED'], ['#EC4899','#DB2777'], ['#F59E0B','#D97706'],
        ['#3B82F6','#2563EB'], ['#EF4444','#DC2626'], ['#10B981','#059669'],
        ['#6366F1','#4F46E5'], ['#F97316','#EA580C'],
    ];
    function colorForId(pid) {
        let h = 0;
        for (let i = 0; i < pid.length; i++) h = ((h << 5) - h + pid.charCodeAt(i)) | 0;
        return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
    }

    const STORAGE_PARTICIPANT_KEY = 'classroom_participant_id';
    const STORAGE_AUTH_USER_KEY  = 'edu_user';
    const searchParams = new URLSearchParams(window.location.search);

    function sanitizeRoomId(value) {
        return String(value || '')
            .trim()
            .replace(/[^a-zA-Z0-9_-]/g, '')
            .slice(0, 64);
    }

    function sanitizeDisplayName(value) {
        return String(value || '')
            .replace(/[\u0000-\u001F\u007F]/g, '')
            .trim()
            .slice(0, 48);
    }

    function generateOpaqueId() {
        if (window.crypto?.randomUUID) {
            return crypto.randomUUID();
        }
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return Array.from(bytes)
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
    }

    function getStoredUserParticipantId() {
        try {
            const user = JSON.parse(localStorage.getItem(STORAGE_AUTH_USER_KEY) || 'null');
            if (user?.id) return String(user.id);
        } catch (_) {
            // Ignore malformed stored user data.
        }
        return null;
    }

    function getStoredAnonParticipantId() {
        try {
            let pid = localStorage.getItem(STORAGE_PARTICIPANT_KEY);
            if (!pid) {
                pid = generateOpaqueId();
                localStorage.setItem(STORAGE_PARTICIPANT_KEY, pid);
            }
            return pid;
        } catch (_) {
            return generateOpaqueId();
        }
    }

    function resolveParticipantId() {
        return getStoredUserParticipantId() || getStoredAnonParticipantId();
    }

    function getPreferredDisplayName() {
        const queryName = sanitizeDisplayName(searchParams.get('name') || '');
        if (queryName) return queryName;
        try {
            const user = JSON.parse(localStorage.getItem(STORAGE_AUTH_USER_KEY) || 'null');
            if (user?.name) return sanitizeDisplayName(user.name);
            if (user?.username) return sanitizeDisplayName(user.username);
        } catch (_) {
            // Ignore malformed user payload.
        }
        return '';
    }

    // Desk rendering

                            <div data-seat-avatar="${seatId}" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-teal-500 to-teal-700 text-white font-bold flex items-center justify-center text-xs md:text-sm shadow-md border border-white/20"></div>
                            <div class="absolute bottom-1 right-1 flex items-center gap-1 bg-gray-900/85 backdrop-blur px-1.5 py-0.5 rounded text-[9px] text-white pointer-events-none">

    function handleDeskClick(seatId) {
        if (!canInteract) { loginForInteraction(); return; }
        if (isSeated && currentSeat === seatId) {
            wsSend({ type: 'leave_seat', seat_id: currentSeat });
            return;
        }
        if (isSeated && currentSeat !== seatId) {
            wsSend({ type: 'leave_seat', seat_id: currentSeat });
        }
        wsSend({ type: 'update_seat', seat_id: seatId });
    }

    function updateSeatLabel(seatId, name, pid = null) {
        if (!seatId) return;
        seatOccupants[seatId] = { name, pid };

        updateSeatMediaUI(seatId);

    function clearSeatLabel(seatId) {

    function renderSeatLabel(seatId) {

    // ==========================================
    // WebRTC COORDINATOR & AUDIO/VIDEO CONTROLS
    // ==========================================
    let localStream = null;
    const localMediaState = { mic_enabled: true, cam_enabled: true };
    const peerConnections = {};
    const pendingCandidates = {};
    const remoteStreams = {};
    const remoteAudioElements = {};
    const participantMediaState = {};

    const RTC_CONFIG = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    async function initLocalMedia() {
        if (!canInteract || localStream) return;
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: { width: { ideal: 480 }, height: { ideal: 360 } }
                });
            }
        } catch (err) {
            console.warn('[WebRTC] getUserMedia error or permission denied:', err);
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, 320, 240);
                localStream = canvas.captureStream(10);
                localMediaState.cam_enabled = false;
                localMediaState.mic_enabled = false;
            } catch (_) {}
        }
        // Attach newly acquired local tracks to any already-created peer connections
        if (localStream) {
            Object.values(peerConnections).forEach(pc => {
                localStream.getTracks().forEach(track => {
                    const senders = pc.getSenders ? pc.getSenders() : [];
                    if (!senders.some(s => s.track && s.track.kind === track.kind)) {
                        try { pc.addTrack(track, localStream); } catch (_) {}
                    }
                });
            });
        }
        updateMediaControlUI();
        broadcastMediaState();
        updateAllSeatsMediaUI();
        syncMeshConnections();
    }

    function toggleMicrophone() {
        if (!canInteract) { loginForInteraction(); return; }
        localMediaState.mic_enabled = !localMediaState.mic_enabled;
        if (localStream) {
            localStream.getAudioTracks().forEach(track => {
                track.enabled = localMediaState.mic_enabled;
            });
        }
        updateMediaControlUI();
        broadcastMediaState();
        updateAllSeatsMediaUI();
    }

    function toggleCamera() {
        if (!canInteract) { loginForInteraction(); return; }
        localMediaState.cam_enabled = !localMediaState.cam_enabled;
        if (localStream) {
            localStream.getVideoTracks().forEach(track => {
                track.enabled = localMediaState.cam_enabled;
            });
        }
        updateMediaControlUI();
        broadcastMediaState();
        updateAllSeatsMediaUI();
    }

    function broadcastMediaState() {
        wsSend({
            type: 'media_state',
            mic_enabled: localMediaState.mic_enabled,
            cam_enabled: localMediaState.cam_enabled
        });
    }

    function updateMediaControlUI() {
        if (!btnToggleMic || !btnToggleCam) return;
        const micOn = localMediaState.mic_enabled;
        const camOn = localMediaState.cam_enabled;

        if (micIcon) micIcon.textContent = micOn ? '🎙️' : '🔇';
        if (micText) micText.textContent = micOn ? 'Mute' : 'Unmute';
        btnToggleMic.classList.toggle('text-red-400', !micOn);
        btnToggleMic.classList.toggle('bg-red-500/10', !micOn);
        btnToggleMic.classList.toggle('border-red-500/30', !micOn);

        if (camIcon) camIcon.textContent = camOn ? '📷' : '🚫';
        if (camText) camText.textContent = camOn ? 'Stop Video' : 'Start Video';
        btnToggleCam.classList.toggle('text-red-400', !camOn);
        btnToggleCam.classList.toggle('bg-red-500/10', !camOn);
        btnToggleCam.classList.toggle('border-red-500/30', !camOn);
    }

    function getOrCreatePeerConnection(peerId) {
        if (peerConnections[peerId]) return peerConnections[peerId];
        let pc;
        try {
            pc = new RTCPeerConnection(RTC_CONFIG);
        } catch (err) {
            console.warn('[WebRTC] RTCPeerConnection construction error:', err);
            return null;
        }
        peerConnections[peerId] = pc;
        pendingCandidates[peerId] = [];

        if (localStream) {
            localStream.getTracks().forEach(track => {
                try {
                    pc.addTrack(track, localStream);
                } catch (err) {
                    console.warn('[WebRTC] addTrack error:', err);
                }
            });
        }

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                const candData = event.candidate.toJSON ? event.candidate.toJSON() : event.candidate;
                wsSend({
                    type: 'ice_candidate',
                    target_peer_id: peerId,
                    target: peerId,
                    candidate: candData
                });
            }
        };

        pc.ontrack = (event) => {
            let stream = remoteStreams[peerId];
            if (!stream) {
                stream = new MediaStream();
                remoteStreams[peerId] = stream;
            }
            if (event.streams && event.streams[0]) {
                event.streams[0].getTracks().forEach(track => {
                    if (!stream.getTracks().some(t => t.id === track.id)) {
                        stream.addTrack(track);
                    }
                });
            }
            if (event.track && !stream.getTracks().some(t => t.id === event.track.id)) {
                stream.addTrack(event.track);
            }

            // Route audio to audio element for playback
            if (event.track.kind === 'audio' || stream.getAudioTracks().length > 0) {
                let audioEl = remoteAudioElements[peerId];
                if (!audioEl) {
                    audioEl = document.createElement('audio');
                    audioEl.autoplay = true;
                    audioEl.playsInline = true;
                    document.body.appendChild(audioEl);
                    remoteAudioElements[peerId] = audioEl;
                }
                if (audioEl.srcObject !== stream) {
                    audioEl.srcObject = stream;
                    audioEl.play().catch(() => {});
                }
            }

            updateAllSeatsMediaUI();
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                closePeerConnection(peerId);
            }
        };

        return pc;
    }

    function closePeerConnection(peerId) {
        if (peerConnections[peerId]) {
            try { peerConnections[peerId].close(); } catch (_) {}
            delete peerConnections[peerId];
        }
        delete pendingCandidates[peerId];
        delete remoteStreams[peerId];
        delete participantMediaState[peerId];
        if (remoteAudioElements[peerId]) {
            try {
                remoteAudioElements[peerId].pause();
                remoteAudioElements[peerId].remove();
            } catch (_) {}
            delete remoteAudioElements[peerId];
        }
        updateAllSeatsMediaUI();
    }

    async function syncMeshConnections() {
        if (!canInteract) return;
        const peerIdsSet = new Set(Object.keys(participants));
        Object.values(seatOccupants).forEach(occ => {
            if (occ && occ.pid) peerIdsSet.add(occ.pid);
        });
        const peerIds = Array.from(peerIdsSet).slice(0, 6);
        for (const peerId of peerIds) {
            if (!peerId || peerId === myParticipantId) continue;
            // Deterministic initiator avoids offer glare (lower participant ID creates offer)
            if (myParticipantId < peerId && !peerConnections[peerId]) {
                try {
                    const pc = getOrCreatePeerConnection(peerId);
                    if (!pc) continue;
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    wsSend({
                        type: 'signal_offer',
                        target_peer_id: peerId,
                        target: peerId,
                        offer: { type: 'offer', sdp: offer.sdp },
                        sdp: offer.sdp
                    });
                } catch (err) {
                    console.warn('[WebRTC] createOffer failed for peer', peerId, err);
                }
            }
        }
    }

    async function handleIncomingOffer(fromPeerId, sdp) {
        if (!canInteract) return;
        try {
            const pc = getOrCreatePeerConnection(fromPeerId);
            if (!pc) return;
            const sdpString = (typeof sdp === 'object' && sdp.sdp) ? sdp.sdp : sdp;
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sdpString }));
            if (pendingCandidates[fromPeerId]) {
                for (const cand of pendingCandidates[fromPeerId]) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(cand));
                    } catch (e) {
                        console.warn('[WebRTC] error adding queued candidate:', e);
                    }
                }
                pendingCandidates[fromPeerId] = [];
            }
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            wsSend({
                type: 'signal_answer',
                target_peer_id: fromPeerId,
                target: fromPeerId,
                answer: { type: 'answer', sdp: answer.sdp },
                sdp: answer.sdp
            });
        } catch (err) {
            console.warn('[WebRTC] handleIncomingOffer error:', err);
        }
    }

    async function handleIncomingAnswer(fromPeerId, sdp) {
        try {
            const pc = peerConnections[fromPeerId];
            if (!pc) return;
            const sdpString = (typeof sdp === 'object' && sdp.sdp) ? sdp.sdp : sdp;
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: sdpString }));
            if (pendingCandidates[fromPeerId]) {
                for (const cand of pendingCandidates[fromPeerId]) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(cand));
                    } catch (e) {
                        console.warn('[WebRTC] error adding candidate on answer:', e);
                    }
                }
                pendingCandidates[fromPeerId] = [];
            }
        } catch (err) {
            console.warn('[WebRTC] handleIncomingAnswer error:', err);
        }
    }

    async function handleIncomingIceCandidate(fromPeerId, candidate) {
        try {
            const pc = peerConnections[fromPeerId];
            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            } else {
                if (!pendingCandidates[fromPeerId]) pendingCandidates[fromPeerId] = [];
                pendingCandidates[fromPeerId].push(candidate);
            }
        } catch (err) {
            console.warn('[WebRTC] handleIncomingIceCandidate error:', err);
        }
    }

    function handleMediaStateUpdate(participantId, mic_enabled, cam_enabled) {
        participantMediaState[participantId] = {
            mic_enabled: mic_enabled !== false,
            cam_enabled: cam_enabled !== false
        };
        updateAllSeatsMediaUI();
    }

    function updateSeatMediaUI(seatId) {
        if (!seatId) return;
        const occupant = seatOccupants[seatId];
        const mediaContainer = document.querySelector(`[data-seat-media="${seatId}"]`);
        const numEl = document.querySelector(`[data-seat-number="${seatId}"]`);
        const videoEl = document.querySelector(`[data-seat-video="${seatId}"]`);
        const avatarEl = document.querySelector(`[data-seat-avatar="${seatId}"]`);
        const micEl = document.querySelector(`[data-seat-mic="${seatId}"]`);
        const camEl = document.querySelector(`[data-seat-cam="${seatId}"]`);

        if (!mediaContainer) return;

        if (!occupant) {
            mediaContainer.classList.add('hidden');
            if (numEl) numEl.classList.remove('hidden');
            if (videoEl) {
                videoEl.srcObject = null;
                videoEl.classList.add('hidden');
            }
            return;
        }

        mediaContainer.classList.remove('hidden');
        if (numEl) numEl.classList.add('hidden');

        const pid = occupant.pid;
        const isLocal = (pid === myParticipantId);
        const mediaState = isLocal
            ? localMediaState
            : (participantMediaState[pid] || { mic_enabled: true, cam_enabled: true });
        const stream = isLocal ? localStream : remoteStreams[pid];

        if (micEl) micEl.textContent = mediaState.mic_enabled !== false ? '🎙️' : '🔇';
        if (camEl) camEl.textContent = mediaState.cam_enabled !== false ? '📷' : '🚫';

        const videoTracks = stream && stream.getVideoTracks ? stream.getVideoTracks() : [];
        const hasVideo = videoTracks.length > 0 && videoTracks.some(t => t.readyState !== 'ended');

        if (mediaState.cam_enabled !== false && hasVideo) {
            if (avatarEl) avatarEl.classList.add('hidden');
            if (videoEl) {
                videoEl.classList.remove('hidden');
                if (videoEl.srcObject !== stream) {
                    videoEl.srcObject = stream;
                }
                videoEl.muted = true; // Desk video tile muted to guarantee zero autoplay blocks
                videoEl.playsInline = true;
                videoEl.play().catch(() => {});
            }
        } else {
            if (videoEl) {
                videoEl.classList.add('hidden');
                videoEl.srcObject = null;
            }
            if (avatarEl) {
                avatarEl.classList.remove('hidden');
                const [c1, c2] = colorForId(pid || 'anon');
                avatarEl.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
                avatarEl.textContent = (occupant.name || '?').charAt(0).toUpperCase();
            }
        }
    }

    function updateAllSeatsMediaUI() {
        for (let r = 0; r < DESK_ROWS; r++) {
            for (let c = 0; c < DESK_COLS; c++) {
                const seatId = `seat-${r * DESK_COLS + c + 1}`;
                updateSeatMediaUI(seatId);
            }
        }
    }

    function cleanupWebRTC() {
        Object.keys(peerConnections).forEach(closePeerConnection);
        if (localStream) {
            try {
                localStream.getTracks().forEach(t => t.stop());
            } catch (_) {}
            localStream = null;
        }
    }

    if (btnToggleMic) btnToggleMic.addEventListener('click', toggleMicrophone);
    if (btnToggleCam) btnToggleCam.addEventListener('click', toggleCamera);

    // Toast
    function showToast(msg, type = 'info') {

        setTimeout(() => {
            el.style.opacity = '0';

    }

    function preserveClassroomRedirect() {

    function applyDisabledStyle(button, disabled) {

    function updateLobbyActionCopy() {

    // Join / Leave
    function joinClassroom() {
        const authenticated = Boolean(isAuthenticated());
        setInteractionMode(authenticated);
        intentionalDisconnect = false;
        reconnectAttempts = 0;
        isSeated = false;
        currentSeat = null;
        roomId = sanitizeRoomId(lobbyRoomId.value) || 'demo-room';
        myDisplayName = sanitizeDisplayName(lobbyDisplayName.value) || (authenticated ? `User-${Math.random().toString(36).slice(2,6)}` : 'Viewer');
        lobbyRoomId.value = roomId;
        lobbyDisplayName.value = myDisplayName;
        myParticipantId = resolveParticipantId();

        topRoomId.textContent = roomId;
        myInitial.textContent = myDisplayName.charAt(0).toUpperCase();
        myNameLabel.textContent = myDisplayName;

        lobby.classList.add('hidden');
        classroomScreen.classList.remove('hidden');
        classroomScreen.classList.add('flex');

        renderDesks();
        connectWS();
        if (canInteract) startGameLoop();
        updatePresenceControls();

    btnJoin.addEventListener('click', joinClassroom);

    lobbyDisplayName.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinClassroom(); });
    lobbyRoomId.addEventListener('keydown', (e) => { if (e.key === 'Enter') lobbyDisplayName.focus(); });

    btnLeave.addEventListener('click', () => {
        cleanupWebRTC();
        disconnectWS();
        stopGameLoop();
        isSeated = false;
        currentSeat = null;
        classroomScreen.classList.add('hidden');
        classroomScreen.classList.remove('flex');
        lobby.classList.remove('hidden');
        Object.keys(participants).forEach(k => delete participants[k]);
        Object.keys(presenceByUser).forEach(k => delete presenceByUser[k]);
        avatarLayer.innerHTML = '';
        chatMessages.innerHTML = '<div class="text-center text-xs text-gray-600 py-6">No messages yet</div>';
        chatFirstMessage = true;
        updateLobbyActionCopy();
    });

    // WebSocket
    function connectWS() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        intentionalDisconnect = false;

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const token = localStorage.getItem('edu_token') || '';
        const params = new URLSearchParams();
        if (token) params.set('token', token);
        params.set('participant_id', myParticipantId);
        params.set('display_name', myDisplayName);

        const url = `${proto}//${location.host}/api/classroom/${encodeURIComponent(roomId)}?${params.toString()}`;

        ws = new WebSocket(url);

        ws.onopen = () => {
            reconnectAttempts = 0;
            setConnStatus(true);
            connectPresenceWS();
            if (canInteract) {
                initLocalMedia();
            }
            showToast(canInteract ? 'Connected to classroom' : 'Viewing classroom', 'success');
        };

        ws.onclose = () => {
            setConnStatus(false);
            if (!intentionalDisconnect) scheduleReconnect();
        };

        ws.onerror = () => { setConnStatus(false); };

        ws.onmessage = (ev) => {
            try {
                handleMessage(JSON.parse(ev.data));
            } catch (err) {
                console.warn('[classroom] dropped malformed ws frame', err, ev.data);
            }
        };
    }

    function disconnectWS() {
        intentionalDisconnect = true;
        cleanupWebRTC();
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        if (presenceReconnectTimer) { clearTimeout(presenceReconnectTimer); presenceReconnectTimer = null; }
        if (ws) { ws.close(); ws = null; }
        if (presenceWs) { presenceWs.close(); presenceWs = null; }
        setConnStatus(false);
    }

    function scheduleReconnect() {
        if (reconnectAttempts >= MAX_RECONNECT) {
            showToast('Lost connection to classroom - please rejoin.', 'error');
            return;
        }
        const delay = Math.min(BASE_DELAY * Math.pow(2, reconnectAttempts), 30000);
        reconnectAttempts++;
        reconnectTimer = setTimeout(() => {
            if (!ws || ws.readyState === WebSocket.CLOSED) connectWS();
        }, delay);
    }

    function setConnStatus(ok) {
        connDot.className = `w-2 h-2 rounded-full dot-pulse ${ok ? 'bg-emerald-400' : 'bg-red-500'}`;
        connText.textContent = ok ? 'Connected' : 'Disconnected';
        connText.className = ok ? 'text-emerald-400' : 'text-red-400';
    }

    function wsSend(obj) {
        if (!canInteract) {
            loginForInteraction();
            return;
        }
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function connectPresenceWS() {
        if (presenceWs && (presenceWs.readyState === WebSocket.OPEN || presenceWs.readyState === WebSocket.CONNECTING)) return;
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const token = localStorage.getItem('edu_token') || '';
        const params = new URLSearchParams();
        if (token) params.set('token', token);
        params.set('user_id', myParticipantId);
        params.set('display_name', myDisplayName);
        const url = `${proto}//${location.host}/api/presence/${encodeURIComponent(roomId)}?${params.toString()}`;
        presenceWs = new WebSocket(url);
        presenceWs.onopen = () => {
            presenceReconnectAttempts = 0;
            if (presenceReconnectTimer) { clearTimeout(presenceReconnectTimer); presenceReconnectTimer = null; }
            updatePresenceControls();
            replaySelfPresence();
        };
        presenceWs.onmessage = (ev) => {
            try {
                handlePresenceMessage(JSON.parse(ev.data));
            } catch (err) {
                console.warn('[presence] dropped malformed ws frame', err, ev.data);
            }
        };
        presenceWs.onerror = () => {
            showToast('Presence channel error', 'warning');
        };
        presenceWs.onclose = () => {
            if (intentionalDisconnect) return;
            if (presenceReconnectAttempts >= MAX_RECONNECT) {
                showToast('Lost connection to presence channel - please rejoin.', 'warning');
                return;
            }
            const delay = Math.min(BASE_DELAY * Math.pow(2, presenceReconnectAttempts), 30000);
            presenceReconnectAttempts++;
            presenceReconnectTimer = setTimeout(() => {
                if (!presenceWs || presenceWs.readyState === WebSocket.CLOSED) connectPresenceWS();
            }, delay);
        };
    }

    function presenceSend(obj) {
        if (!canInteract) return;
        if (presenceWs && presenceWs.readyState === WebSocket.OPEN) {
            presenceWs.send(JSON.stringify(obj));
            return;
        }
        pendingSelfPresenceReplay = true;
    }

    function replaySelfPresence() {
        if (!canInteract) return;
        const self = presenceByUser[myParticipantId];
        if (!self || !pendingSelfPresenceReplay) return;
        if (!presenceWs || presenceWs.readyState !== WebSocket.OPEN) return;
        presenceWs.send(JSON.stringify({
            type: 'presence',
            x: Number.isFinite(Number(self.x)) ? Number(self.x) : 0.5,
            y: Number.isFinite(Number(self.y)) ? Number(self.y) : 0.5,
            emoji: typeof self.emoji === 'string' ? self.emoji : '',
            hand_raised: self.hand_raised === true,
        }));
        pendingSelfPresenceReplay = false;
    }

    function handlePresenceMessage(data) {
        if (!data || typeof data !== 'object') return;
        if (data.type === 'welcome' && data.state && typeof data.state === 'object') {
            const localSelf = presenceByUser[myParticipantId] ? { ...presenceByUser[myParticipantId] } : null;
            Object.keys(presenceByUser).forEach((k) => delete presenceByUser[k]);
            Object.entries(data.state).forEach(([uid, state]) => {
                presenceByUser[uid] = {
                    x: Number.isFinite(Number(state?.x)) ? Number(state.x) : 0.5,
                    y: Number.isFinite(Number(state?.y)) ? Number(state.y) : 0.5,
                    emoji: typeof state?.emoji === 'string' ? state.emoji : '',
                    hand_raised: state?.hand_raised === true,
                    display_name: typeof state?.display_name === 'string' ? state.display_name : uid,
                };
            });
            if (localSelf) {
                const serverSelf = presenceByUser[myParticipantId] || {};
                presenceByUser[myParticipantId] = {
                    ...serverSelf,
                    x: Number.isFinite(Number(localSelf.x)) ? Number(localSelf.x) : (Number.isFinite(Number(serverSelf.x)) ? Number(serverSelf.x) : 0.5),
                    y: Number.isFinite(Number(localSelf.y)) ? Number(localSelf.y) : (Number.isFinite(Number(serverSelf.y)) ? Number(serverSelf.y) : 0.5),
                    emoji: typeof localSelf.emoji === 'string' ? localSelf.emoji : (serverSelf.emoji || ''),
                    hand_raised: localSelf.hand_raised === true,
                    display_name: localSelf.display_name || serverSelf.display_name || myDisplayName,
                };
            }
            renderOtherAvatars();
            renderParticipantsList();
            renderSeatLabels();
            updatePresenceControls();
            return;
        }
        if (data.type === 'delta' && data.user_id) {
            const current = presenceByUser[data.user_id] || {
                x: 0.5, y: 0.5, emoji: '', hand_raised: false, display_name: data.user_id,
            };
            const next = { ...current };
            if (Object.prototype.hasOwnProperty.call(data, 'x')) next.x = Number.isFinite(Number(data.x)) ? Number(data.x) : current.x;
            if (Object.prototype.hasOwnProperty.call(data, 'y')) next.y = Number.isFinite(Number(data.y)) ? Number(data.y) : current.y;
            if (Object.prototype.hasOwnProperty.call(data, 'emoji') && typeof data.emoji === 'string') next.emoji = data.emoji;
            if (Object.prototype.hasOwnProperty.call(data, 'hand_raised') && typeof data.hand_raised === 'boolean') next.hand_raised = data.hand_raised;
            if (Object.prototype.hasOwnProperty.call(data, 'display_name') && typeof data.display_name === 'string') next.display_name = data.display_name;
            presenceByUser[data.user_id] = next;
            renderOtherAvatars();
            renderParticipantsList();
            renderSeatLabels();
            updatePresenceControls();
            return;
        }
        if (data.type === 'leave' && data.user_id) {
            delete presenceByUser[data.user_id];
            renderOtherAvatars();
            renderParticipantsList();
            renderSeatLabels();
            updatePresenceControls();
        }
    }

    // Message handler
    function handleMessage(data) {
        switch (data.type) {

            case 'user_info':
                mySessionId     = data.session_id;
                myParticipantId = data.participant_id;
                myDisplayName   = data.display_name;
                setInteractionMode(data.can_interact !== false && Boolean(isAuthenticated()));
                if (!canInteract) {
                    myCharacter.style.display = 'none';
                    renderParticipantsList();
                    break;
                }
                if (!presenceByUser[myParticipantId]) {
                    presenceByUser[myParticipantId] = {
                        x: 0.5, y: 0.5, emoji: '', hand_raised: false, display_name: myDisplayName,
                    };
                }
                myInitial.textContent  = myDisplayName.charAt(0).toUpperCase();
                myNameLabel.textContent = myDisplayName;
                updatePresenceControls();

                // Place the local character at the centre of the canvas (in px).
                myCharacter.style.display = '';
                myPos.x = classroomCanvas.getBoundingClientRect().width  * 0.5;
                myPos.y = classroomCanvas.getBoundingClientRect().height * 0.5;
                myCharacter.style.left = myPos.x + 'px';
                myCharacter.style.top  = myPos.y + 'px';
                syncMeshConnections();
                break;

            case 'room_state':
                handleRoomState(data);
                break;

            case 'participant_joined':
                if (data.participant_id !== myParticipantId) {
                    showToast(`${data.display_name} joined the classroom`, 'success');
                    if (!participants[data.participant_id]) {
                        participants[data.participant_id] = {
                            display_name: data.display_name || data.participant_id,
                            normPos: { x: 0.5, y: 0.5 },
                            direction: 'down',
                            is_moving: false,
                            seat_id: '',
                        };
                    }
                    if (data.media_state) {
                        const m = data.media_state;
                        participantMediaState[data.participant_id] = {
                            mic_enabled: m.mic_enabled !== undefined ? m.mic_enabled : m.audio,
                            cam_enabled: m.cam_enabled !== undefined ? m.cam_enabled : m.video,
                        };
                    }
                    syncMeshConnections();
                    updateAllSeatsMediaUI();
                }
                break;

            case 'signal_offer': {
                const fromId = data.sender_peer_id || data.from;
                const sdp = (typeof data.offer === 'object' && data.offer?.sdp) ? data.offer.sdp : (data.sdp || data.offer);
                if (fromId && sdp) {
                    handleIncomingOffer(fromId, sdp);
                }
                break;
            }

            case 'signal_answer': {
                const fromId = data.sender_peer_id || data.from;
                const sdp = (typeof data.answer === 'object' && data.answer?.sdp) ? data.answer.sdp : (data.sdp || data.answer);
                if (fromId && sdp) {
                    handleIncomingAnswer(fromId, sdp);
                }
                break;
            }

            case 'ice_candidate': {
                const fromId = data.sender_peer_id || data.from;
                const cand = data.candidate;
                if (fromId && cand) {
                    handleIncomingIceCandidate(fromId, cand);
                }
                break;
            }

            case 'media_state': {
                const pid = data.participant_id;
                const mic = (data.mic_enabled !== undefined) ? data.mic_enabled : data.audio;
                const cam = (data.cam_enabled !== undefined) ? data.cam_enabled : data.video;
                if (pid) {
                    handleMediaStateUpdate(pid, mic, cam);
                }
                break;
            }

            case 'position_update':
                if (data.participant_id !== myParticipantId) {
                    // data.position is already normalized (0–1).
                    if (!participants[data.participant_id]) {
                        participants[data.participant_id] = {
                            display_name: data.display_name || data.participant_id,
                            normPos:      data.position || { x: 0.5, y: 0.5 },
                            direction:    data.direction || 'down',
                            is_moving:    data.isMoving  || false,
                            seat_id:      '',
                        };
                    } else {
                        participants[data.participant_id].normPos    = data.position;
                        participants[data.participant_id].direction  = data.direction;
                        participants[data.participant_id].is_moving  = data.isMoving;
                        if (data.display_name) participants[data.participant_id].display_name = data.display_name;
                    }
                    renderOtherAvatars();
                }
                break;

            case 'chat_message':
                appendChatMessage(data.display_name, data.text, data.participant_id === myParticipantId);
                break;

            case 'seat_updated':
                if (!participants[data.participant_id] && data.participant_id !== myParticipantId) {
                    participants[data.participant_id] = {
                        display_name: data.display_name || data.participant_id,
                        normPos: { x: 0.5, y: 0.5 },
                        direction: 'down',
                        is_moving: false,
                        seat_id: '',
                    };
                }
                if (participants[data.participant_id]) {
                    participants[data.participant_id].seat_id = data.seat_id || '';
                    if (data.display_name) participants[data.participant_id].display_name = data.display_name;
                }
                if (data.participant_id === myParticipantId) {
                    isSeated = true;
                    currentSeat = data.seat_id;
                    myCharacter.style.display = 'none';
                }
                updateSeatLabel(data.seat_id, data.display_name, data.participant_id);
                showToast(`${data.display_name} took ${data.seat_id}`, 'info');
                syncMeshConnections();
                updateAllSeatsMediaUI();
                renderOtherAvatars();
                renderParticipantsList();
                break;

            case 'seat_left':
                if (participants[data.participant_id]) {
                    participants[data.participant_id].seat_id = '';
                    if (data.display_name) participants[data.participant_id].display_name = data.display_name;
                }
                if (data.participant_id === myParticipantId) {
                    isSeated = false;
                    currentSeat = null;
                    myCharacter.style.display = '';
                }
                clearSeatLabel(data.seat_id);
                showToast(`${data.display_name} left ${data.seat_id}`, 'info');
                renderOtherAvatars();
                renderParticipantsList();
                break;

            case 'seat_occupied':
                isSeated = false;
                currentSeat = null;
                showToast(data.message || 'Seat is taken!', 'warning');
                break;
        }
    }

    // Room state (bulk sync on join / reconnect)
    function handleRoomState(data) {
        Object.keys(participants).forEach(k => delete participants[k]);
        Object.keys(seatOccupants).forEach(k => delete seatOccupants[k]);
        document.querySelectorAll('[data-seat-label]').forEach(el => {
            el.textContent = '';
            el.classList.add('hidden');
        });

        (data.participants || []).forEach(p => {
            if (p.media_state) {
                participantMediaState[p.participant_id] = p.media_state;
            }
            if (p.participant_id === myParticipantId) return;

            // Incoming positions may be:
            //   (a) normalized 0–1  ← new format
            //   (b) non-normalized pixel values from older clients  ← handle gracefully
            // We detect non-normalized values by checking if x > 2 (normalized values are ≤ 1.0).
            let normPos = p.position || { x: 0.5, y: 0.5 };
            if (normPos.x > 2 || normPos.y > 2) {
                // Pixel coords — convert on first receipt
                const r = classroomCanvas.getBoundingClientRect();
                normPos = {
                    x: r.width  > 0 ? normPos.x / r.width  : 0.5,
                    y: r.height > 0 ? normPos.y / r.height : 0.5,
                };
            }

            participants[p.participant_id] = {
                display_name: p.display_name,
                normPos,
                direction:    p.direction  || 'down',
                is_moving:    p.is_moving  || false,
                seat_id:      p.seat_id    || '',
            };
            if (p.seat_id) updateSeatLabel(p.seat_id, p.display_name, p.participant_id);
        });

        // Restore own seat if server knows about it
        const selfP = canInteract ? (data.participants || []).find(p => p.participant_id === myParticipantId) : null;
        if (selfP && selfP.seat_id) {
            updateSeatLabel(selfP.seat_id, myDisplayName, myParticipantId);
            isSeated = true;
            currentSeat = selfP.seat_id;
            myCharacter.style.display = 'none';
        } else if (!canInteract) {
            isSeated = false;
            currentSeat = null;
            myCharacter.style.display = 'none';
        } else {
            myCharacter.style.display = '';
        }

        const serverCount = Number(data.count);
        participantCount.textContent = Number.isFinite(serverCount)
            ? serverCount
            : (Object.keys(participants).length + (canInteract ? 1 : 0));
        renderOtherAvatars();
        renderParticipantsList();
        syncMeshConnections();
        updateAllSeatsMediaUI();
    }

    // Render other participants
    // normPos (0–1) is multiplied by the current canvas pixel size at render time,
    // so every client converts to the same on-screen position regardless of their
    // window size.
    function renderOtherAvatars() {
        avatarLayer.innerHTML = '';
        const canvasRect = classroomCanvas.getBoundingClientRect();

        Object.entries(participants).forEach(([pid, p]) => {
            if (p.seat_id) return;
            const [c1, c2] = colorForId(pid);

            // Convert stored normalized position to local pixels
            const px = p.normPos.x * canvasRect.width;
            const py = p.normPos.y * canvasRect.height;

            // Clamp to canvas bounds so avatars never drift off-screen
            const x = Math.max(0, Math.min(px, canvasRect.width  - 40));
            const y = Math.max(0, Math.min(py, canvasRect.height - 50));

            const el = document.createElement('div');
            el.className = 'absolute transition-all duration-75 ease-linear flex flex-col items-center';
            el.style.left      = x + 'px';
            el.style.top       = y + 'px';
            el.style.zIndex    = '41';
            el.style.transform = 'translate(-50%, -50%)';
            el.innerHTML = `
                <div class="relative w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-lg border-2 border-white/20"
                     style="background: linear-gradient(135deg, ${c1}, ${c2});">
                    ${(p.display_name || '?').charAt(0).toUpperCase()}
                    <span class="absolute -top-1 -right-1 text-[12px] leading-none">${presenceBadge(pid)}</span>
                </div>
                <div class="mt-0.5 px-1.5 py-0.5 bg-gray-900/90 rounded text-[9px] text-white font-medium whitespace-nowrap shadow">
                    ${escapeHtml(p.display_name || pid)}
                </div>
            `;
            avatarLayer.appendChild(el);
        });
    }

    // Participants list sidebar
    function renderParticipantsList() {
        participantsList.innerHTML = '';
        if (canInteract) {
            participantsList.appendChild(makeParticipantCard(myParticipantId, myDisplayName, currentSeat, true));
        } else {
            const viewerCard = document.createElement('div');
            viewerCard.className = 'p-3 rounded-lg border border-amber-500/30 bg-amber-500/10 text-xs text-amber-100';
            viewerCard.textContent = 'Viewing only. Sign in to appear in the room and interact.';
            participantsList.appendChild(viewerCard);
        }
        Object.entries(participants).forEach(([pid, p]) => {
            participantsList.appendChild(makeParticipantCard(pid, p.display_name, p.seat_id, false));
        });
    }

    function makeParticipantCard(pid, name, seatId, isSelf) {
        const [c1, c2] = isSelf ? ['#0D9488', '#14b8a6'] : colorForId(pid);
        const card = document.createElement('div');
        card.className = 'flex items-center gap-3 p-2.5 bg-gray-800/60 rounded-lg border border-gray-700/40';
        card.innerHTML = `
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                 style="background: linear-gradient(135deg, ${c1}, ${c2});">
                ${(name || '?').charAt(0).toUpperCase()}
            </div>
            <div class="min-w-0 flex-1">
                <p class="text-xs font-medium text-gray-200 truncate">${escapeHtml(name)}${isSelf ? ' <span class="text-teal-400">(You)</span>' : ''}</p>
                <p class="text-[10px] text-gray-500">${seatId ? 'Seat ' + escapeHtml(seatId) : 'Walking around'}</p>
                <p class="text-[11px] text-gray-300 mt-0.5">${presenceBadge(pid)}</p>
            </div>
        `;
        return card;
    }

    function presenceBadge(userId) {
        const p = presenceByUser[userId];
        if (!p) return '';
        // Returned string is safe for innerHTML interpolation (emoji is escaped).
        let badge = '';
        if (p.emoji) badge += escapeHtml(p.emoji) + ' ';
        if (p.hand_raised) badge += '✋';
        return badge.trim();
    }

    function updatePresenceControls() {
        const self = presenceByUser[myParticipantId] || { emoji: '', hand_raised: false };
        btnThumbsUp.classList.toggle('bg-teal-700', self.emoji === '👍');
        btnThumbsUp.classList.toggle('border-teal-500', self.emoji === '👍');
        btnRaiseHand.classList.toggle('bg-teal-700', self.hand_raised === true);
        btnRaiseHand.classList.toggle('border-teal-500', self.hand_raised === true);
        myPresenceBadge.textContent = presenceBadge(myParticipantId);
        renderSeatLabels();
    }

    btnThumbsUp.addEventListener('click', () => {
        if (!canInteract) { loginForInteraction(); return; }
        const current = presenceByUser[myParticipantId] || {};
        const nextEmoji = current.emoji === '👍' ? '' : '👍';
        pendingSelfPresenceReplay = true;
        presenceByUser[myParticipantId] = {
            x: Number.isFinite(Number(current.x)) ? Number(current.x) : 0.5,
            y: Number.isFinite(Number(current.y)) ? Number(current.y) : 0.5,
            emoji: nextEmoji,
            hand_raised: current.hand_raised === true,
            display_name: current.display_name || myDisplayName,
        };
        renderOtherAvatars();
        renderParticipantsList();
        renderSeatLabels();
        updatePresenceControls();
        presenceSend({ type: 'presence', emoji: nextEmoji });
    });

    btnRaiseHand.addEventListener('click', () => {
        if (!canInteract) { loginForInteraction(); return; }
        const current = presenceByUser[myParticipantId] || {};
        const nextHandRaised = current.hand_raised !== true;
        pendingSelfPresenceReplay = true;
        presenceByUser[myParticipantId] = {
            x: Number.isFinite(Number(current.x)) ? Number(current.x) : 0.5,
            y: Number.isFinite(Number(current.y)) ? Number(current.y) : 0.5,
            emoji: typeof current.emoji === 'string' ? current.emoji : '',
            hand_raised: nextHandRaised,
            display_name: current.display_name || myDisplayName,
        };
        renderOtherAvatars();
        renderParticipantsList();
        renderSeatLabels();
        updatePresenceControls();
        presenceSend({ type: 'presence', hand_raised: nextHandRaised });
    });

    // Chat
    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!canInteract) { loginForInteraction(); return; }
        const text = chatInput.value.trim();
        if (!text) return;
        wsSend({ type: 'chat_message', text, timestamp: new Date().toISOString() });
        chatInput.value = '';
    });

    function appendChatMessage(name, text, isSelf) {
        if (chatFirstMessage) { chatMessages.innerHTML = ''; chatFirstMessage = false; }

        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} fade-in-up`;
        const [c1] = isSelf ? ['#0D9488'] : colorForId(name.toLowerCase().replace(/\s+/g, '-'));
        wrapper.innerHTML = `
            <span class="text-[10px] font-medium mb-0.5 px-1" style="color:${c1};">${escapeHtml(name)}</span>
            <div class="max-w-[85%] px-3 py-1.5 rounded-xl text-xs leading-relaxed ${isSelf ? 'bg-teal-600 text-white rounded-br-sm' : 'bg-gray-800 text-gray-200 rounded-bl-sm'}">
                ${escapeHtml(text)}
            </div>
        `;
        chatMessages.appendChild(wrapper);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Participants sidebar toggle
    btnParticipants.addEventListener('click', () => {
        participantsSidebar.classList.toggle('translate-x-full');
        btnParticipants.setAttribute(
            'aria-expanded',
            String(!participantsSidebar.classList.contains('translate-x-full'))
        );
        renderParticipantsList();
    });
    btnCloseParticipants.addEventListener('click', () => {
        participantsSidebar.classList.add('translate-x-full');
        btnParticipants.setAttribute('aria-expanded', 'false');
    });

    // Movement / Game Loop
    // myPos is always in LOCAL pixel coords (used for rendering the local avatar).
    // When we send a position over the wire we normalize it first with toNorm().
    const myPos = { x: 400, y: 300 };
    const myVel = { x: 0,   y: 0   };
    let myDirection = 'down';
    let myIsMoving  = false;
    let wasMoving   = false;

    function isTypingInInput(target) {
        if (!target) return false;
        const tag = target.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable;
    }

    window.addEventListener('keydown', (e) => {
        if (isTypingInInput(e.target)) return;
        if (!canInteract) {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
            if (e.key.toLowerCase() === 'e') { e.preventDefault(); loginForInteraction(); }
            return;
        }
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            if (!isSeated) { keysPressed[e.key] = true; e.preventDefault(); }
        }
        if (e.key.toLowerCase() === 'e') handleSeatInteraction();
    });
    window.addEventListener('keyup', (e) => {
        if (isTypingInInput(e.target)) return;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            keysPressed[e.key] = false;
            e.preventDefault();
        }
    });

    function handleSeatInteraction() {
        if (!canInteract) { loginForInteraction(); return; }
        if (isSeated) {
            wsSend({ type: 'leave_seat', seat_id: currentSeat });
            return;
        }
        const canvasRect = classroomCanvas.getBoundingClientRect();
        const desks = desksContainer.querySelectorAll('[data-seat-chair]');
        let nearest = null;
        let nearestDist = Infinity;
        desks.forEach(chair => {
            const seatId = chair.getAttribute('data-seat-chair');
            const rect   = chair.getBoundingClientRect();
            const cx = rect.left + rect.width  / 2 - canvasRect.left;
            const cy = rect.top  + rect.height / 2 - canvasRect.top;
            const dist = Math.hypot(myPos.x - cx, myPos.y - cy);
            if (dist < nearestDist) { nearestDist = dist; nearest = seatId; }
        });
        if (nearest && nearestDist < 95) {
            wsSend({ type: 'update_seat', seat_id: nearest });
        }
    }

    function startGameLoop() {
        if (!canInteract) return;
        function tick() {
            const accel    = 0.8;
            const friction = 0.85;
            const canvasRect = classroomCanvas.getBoundingClientRect();
            const pad = 20;

            if (!isSeated) {
                if (keysPressed.ArrowUp)    { myVel.y -= accel; myDirection = 'up';    }
                if (keysPressed.ArrowDown)  { myVel.y += accel; myDirection = 'down';  }
                if (keysPressed.ArrowLeft)  { myVel.x -= accel; myDirection = 'left';  }
                if (keysPressed.ArrowRight) { myVel.x += accel; myDirection = 'right'; }
            }

            myVel.x *= friction;
            myVel.y *= friction;

            myPos.x = Math.max(pad, Math.min(myPos.x + myVel.x, canvasRect.width  - pad));
            myPos.y = Math.max(pad, Math.min(myPos.y + myVel.y, canvasRect.height - pad));

            myIsMoving = Math.abs(myVel.x) > 0.1 || Math.abs(myVel.y) > 0.1;

            myCharacter.style.display = isSeated ? 'none' : '';
            myCharacter.style.left      = myPos.x + 'px';
            myCharacter.style.top       = myPos.y + 'px';
            myCharacter.style.transform = 'translate(-50%, -50%)';

            // Send position (throttled).
            // IMPORTANT: normalize to 0–1 before sending so every peer renders
            // at the same relative position regardless of their canvas pixel size.
            const now        = Date.now();
            const shouldSend = canInteract && (myIsMoving || wasMoving) && !isSeated;
            if (shouldSend && now - lastPositionSend > THROTTLE_MS) {
                lastPositionSend = now;
                const norm = toNorm(myPos.x, myPos.y);
                wsSend({
                    type:      'position_update',
                    position:  norm,          // normalized (0–1)
                    direction: myDirection,
                    isMoving:  myIsMoving,
                });
            }
            wasMoving = myIsMoving;

            animFrameId = requestAnimationFrame(tick);
        }
        animFrameId = requestAnimationFrame(tick);
    }

    function stopGameLoop() {
        if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
        keysPressed = {};
        myPos.x = 400; myPos.y = 300;
        myVel.x = 0;   myVel.y = 0;
        wasMoving = false;
        isSeated  = false;
        currentSeat = null;
        myCharacter.style.display = 'none';
    }

    // Utilities
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Init Lucide icons and entry behavior
    refreshIcons();
    updateLobbyActionCopy();
    viewerLoginLink.addEventListener('click', preserveClassroomRedirect);
    const preferredName = getPreferredDisplayName();
    if (preferredName) lobbyDisplayName.value = preferredName;

    const initialRoom = sanitizeRoomId(searchParams.get('room') || '');
    if (initialRoom) lobbyRoomId.value = initialRoom;

    const shouldAutoJoin = searchParams.get('autojoin') === '1';
    if (shouldAutoJoin && btnJoin) {
        if (!lobbyRoomId.value) lobbyRoomId.value = 'lobby';
        joinClassroom();
    } else {
        lobbyDisplayName.focus();
    }
})();
</script>
